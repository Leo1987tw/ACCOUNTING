<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>清新雙軌記帳 new Minimal Ledger</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* 1. 預設主題：私人生活帳（鼠尾草淡綠） */
        :root {
            --bg-color: #f4f7f5;
            --primary: #6b8e7d;
            --primary-light: #e8efe9;
            --primary-hover: #557263;
            --text-main: #334139;
            --text-muted: #708076;
            --card-bg: #ffffff;
            --accent-red: #c97a7a;
            --accent-blue: #7aa5c9;
            --transition-speed: 0.4s;
        }

        /* 2. 切換主題：公司帳（商務典雅藍灰） */
        [data-theme="company"] {
            --bg-color: #f0f3f6;
            --primary: #5b7083;
            --primary-light: #e2e8ed;
            --primary-hover: #435464;
            --text-main: #2c353d;
            --text-muted: #657786;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            transition: background-color var(--transition-speed) ease;
        }

        /* 帳簿切換列 */
        .ledger-switcher-bar {
            width: 100%;
            background: var(--primary-light);
            padding: 12px 40px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(107, 142, 125, 0.15);
            transition: background var(--transition-speed) ease;
        }

        .ledger-switcher-bar span {
            font-weight: 500;
            color: var(--primary);
            font-size: 0.95rem;
            transition: color var(--transition-speed) ease;
        }

        .ledger-select {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid rgba(107, 142, 125, 0.3);
            font-size: 0.9rem;
            font-weight: 500;
            background: var(--card-bg);
            cursor: pointer;
            width: auto;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: 1fr 1.6fr;
            gap: 30px;
            padding: 30px 20px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
            border: 1px solid rgba(107, 142, 125, 0.1);
            transition: border var(--transition-speed) ease;
        }

        h2 {
            font-size: 1.25rem;
            font-weight: 500;
            margin-bottom: 20px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color var(--transition-speed) ease;
        }

        .dashboard {
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .balance-box {
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            background: var(--primary-light);
            transition: background var(--transition-speed) ease;
        }

        .balance-box.expense {
            background: #fdf2f2;
        }

        .balance-box.income {
            background: #f2f7fd;
        }

        .balance-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .balance-amount {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .expense .balance-amount {
            color: var(--accent-red);
        }

        .income .balance-amount {
            color: var(--accent-blue);
        }

        .form-group {
            margin-bottom: 16px;
        }

        /* 🎨 新增：雙選單並排的一行佈局 */
        .form-row-double {
            display: grid;
            grid-template-columns: 4fr 6fr;
            /* 左側科目佔 40%，右側分類佔 60% */
            gap: 12px;
            margin-bottom: 16px;
        }

        .form-row-double .form-group {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(107, 142, 125, 0.2);
            border-radius: 8px;
            background-color: #fafdfb;
            color: var(--text-main);
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(107, 142, 125, 0.15);
            background-color: #ffffff;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background var(--transition-speed) ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .ledger-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 520px;
            overflow-y: auto;
        }

        .ledger-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            border-radius: 10px;
            background: #fafdfb;
            border-left: 4px solid var(--primary);
            transition: transform 0.2s ease;
        }

        .ledger-item:hover {
            transform: translateY(-2px);
        }

        .item-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .item-title {
            font-weight: 500;
            font-size: 0.95rem;
        }

        .item-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .item-meta span {
            margin-right: 8px;
            background: var(--primary-light);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            transition: background var(--transition-speed) ease;
        }

        .item-amount {
            font-weight: 700;
            font-size: 1.05rem;
        }

        .item-amount.expense {
            color: var(--accent-red);
        }

        .item-amount.income {
            color: var(--accent-blue);
        }
    </style>
</head>

<body>

    <!-- 頂部帳簿切換列 -->
    <div class="ledger-switcher-bar">
        <span>📂 當前工作帳簿：</span>
        <select id="ledgerSwitcher" class="ledger-select">
            <!-- <option value="personal">🏡 麥斯個人的私人生活帳 (Ledger #1)</option> -->
            <option value="personal">🏡 禮中個人的私人生活帳 (Ledger #1)</option>
            <option value="company">🏢 頂尖科技股份有限公司 (Ledger #2)</option>
        </select>
    </div>

    <div class="container">
        <!-- 左側：輸入表單 -->
        <div>
            <div class="dashboard">
                <div class="balance-box income">
                    <div class="balance-label">當期總收入</div>
                    <div id="totalIncome" class="balance-amount">+ $52,000</div>
                </div>
                <div class="balance-box expense">
                    <div class="balance-label">當期總支出</div>
                    <div id="totalExpense" class="balance-amount">- $14,850</div>
                </div>
            </div>

            <div class="card">
                <h2 id="formTitle">✍️ 新增帳務分錄 (私人帳)</h2>
                <form id="ledgerForm">
                    <div class="form-group">
                        <label>交易日期</label>
                        <input type="date" id="txDate" required value="2026-05-23">
                    </div>

                    <!-- 🎨 微調核心：將會計科目與功能分類包進同一個並排的 form-row-double 行內 -->
                    <div class="form-row-double">
                        <div class="form-group">
                            <label>會計項目</label>
                            <select id="accountSelect" required></select>
                        </div>
                        <div class="form-group">
                            <label id="categoryLabel">功能分類 (Category)</label>
                            <select id="categorySelect" required></select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>交易金額</label>
                        <input type="number" id="amount" placeholder="0.00" required min="1" value="1">
                    </div>

                    <div class="form-group">
                        <label>往來對象 (Partner)</label>
                        <select id="partnerSelect">
                            <option value="一般零售現金戶">🛒 一般零星消費 / 散客</option>
                            <option value="全聯福利中心">全聯福利中心</option>
                            <option value="台灣中油">台灣中油</option>
                            <option value="某某有限公司">某某有限公司</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>備註說明 (Memo)</label>
                        <input type="text" id="memo" placeholder="輸入交易細節...">
                    </div>

                    <button type="submit" class="btn-submit">確認記入日記簿</button>
                </form>
            </div>
        </div>

        <!-- 右側：歷史日記簿明細 -->
        <div class="card">
            <h2 id="listTitle">📋 歷史日記簿明細 (Ledger #1)</h2>
            <div class="ledger-list" id="ledgerList"></div>
        </div>
    </div>

    <script>
        // 1. 隔離的會計科目資料 (40% 寬度)
        const accountsData = {
            personal: [
                { id: 1, name: "💵 現金資產" },
                { id: 2, name: "💳 銀行存款" },
                { id: 3, name: "📉 信用卡負債" },
                { id: 4, name: "🍔 伙食支出" },
                { id: 5, name: "💻 薪資收入" }
            ],
            company: [
                { id: 6, name: "🏦 營業活存" },
                { id: 7, name: "🏢 營業費用" },
                { id: 8, name: "📦 銷貨收入" },
                { id: 9, name: "🤝 股東往來" }
            ]
        };

        // 2. 隔離的功能分類資料 (60% 寬度)
        const categoriesData = {
            personal: [
                { id: 101, name: "🍔 食 (伙食餐飲)" },
                { id: 102, name: "👕 衣 (服飾治裝)" },
                { id: 103, name: "🏠 住 (房租水電)" },
                { id: 104, name: "🚗 行 (交通加油)" },
                { id: 105, name: "📚 育 (教育文化)" },
                { id: 105, name: "🎉 樂 (娛樂社交)" },
                { id: 106, name: "🛡️ 非消費移轉" }
            ],
            company: [
                { id: 201, name: "🍵 交際應酬費" },
                { id: 202, name: "🏢 辦公室月租" },
                { id: 203, name: "✈️ 差旅與交通" },
                { id: 204, name: "📑 辦公文具耗材" },
                { id: 205, name: "💻 軟體與網路費" }
            ]
        };

        // 3. 初始動態帳本資料庫結構
        const initialHistory = {
            personal: [],
            company: []
        };

        const switcher = document.getElementById('ledgerSwitcher');
        const accountSelect = document.getElementById('accountSelect');
        const categorySelect = document.getElementById('categorySelect');
        const categoryLabel = document.getElementById('categoryLabel');
        const ledgerList = document.getElementById('ledgerList');
        const ledgerForm = document.getElementById('ledgerForm');

        // 🔄 函數：同步切換帳簿主題、換色與過濾下拉選單
        function updateLedgerTheme() {
            const selectedLedger = switcher.value;

            // A. 頂層變色切換
            document.documentElement.setAttribute('data-theme', selectedLedger);
            document.getElementById('formTitle').innerText = selectedLedger === 'personal' ? '✍️ 新增帳務分錄 (私人帳)' : '✍️ 新增帳務分錄 (公司帳)';
            document.getElementById('listTitle').innerText = selectedLedger === 'personal' ? '📋 歷史日記簿明細 (Ledger #1)' : '📋 歷史日記簿明細 (Ledger #2)';
            categoryLabel.innerText = selectedLedger === 'personal' ? '日常功能分類 (Category)' : '稅務費用分類 (Category)';

            // B. 動態過濾渲染會計項目
            accountSelect.innerHTML = '';
            accountsData[selectedLedger].forEach(acc => {
                const opt = document.createElement('option');
                opt.value = acc.name;
                opt.innerText = acc.name;
                accountSelect.appendChild(opt);
            });

            // C. 動態過濾渲染功能分類
            categorySelect.innerHTML = '';
            categoriesData[selectedLedger].forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat.name;
                opt.innerText = cat.name;
                categorySelect.appendChild(opt);
            });

            // D. 刷新渲染歷史日記簿列表
            renderList(selectedLedger);
        }

        // 📊 函數：計算金額並渲染右側卡片列表
        function renderList(ledgerType) {
            ledgerList.innerHTML = '';
            let incomeSum = 0;
            let expenseSum = 0;

            initialHistory[ledgerType].forEach(item => {
                if (item.amount > 0) incomeSum += item.amount;
                else expenseSum += Math.abs(item.amount);

                const div = document.createElement('div');
                div.className = 'ledger-item';
                div.style.borderLeftColor = item.amount > 0 ? 'var(--accent-blue)' : 'var(--accent-red)';

                // 使用反單引號與標準語法渲染
                div.innerHTML = `
                <div class="item-left">
                    <div class="item-title">${item.title}</div>
                    <div class="item-meta">
                        <span>${item.account}</span>
                        <span>${item.category}</span>
                        <span>${item.partner}</span>
                        ${item.date}
                    </div>
                </div>
                <div class="item-amount ${item.amount > 0 ? 'income' : 'expense'}">
                    ${item.amount > 0 ? '+' : '-'} $${Math.abs(item.amount).toLocaleString()}
                </div>
            `;
                ledgerList.appendChild(div);
            });

            // 動態更新看板總金額
            document.getElementById('totalIncome').innerText = `+ $${incomeSum.toLocaleString()}`;
            document.getElementById('totalExpense').innerText = `- $${expenseSum.toLocaleString()}`;
        }

        // ➕ 監聽：點擊確認記入日記簿時，動態新增並重算總額
        ledgerForm.addEventListener('submit', function (e) {
            e.preventDefault(); // 阻止網頁跳轉刷新

            const selectedLedger = switcher.value;
            const amt = parseFloat(document.getElementById('amount').value);
            const accountName = accountSelect.value;

            // 核心智慧防呆：根據會計項目的名稱字眼，自動判定是「收入」還是「支出」
            // 如果選的是負債或支出/費用，金額自動轉為負數；若含有收入字眼，則為正數
            let finalAmount = amt;
            if (accountName.includes('支出') || accountName.includes('費用') || accountName.includes('負債')) {
                finalAmount = -Math.abs(amt);
            }

            // 構造新記帳物件
            const newRecord = {
                title: document.getElementById('memo').value || '未填寫備註交易',
                account: accountName,
                category: categorySelect.value,
                partner: document.getElementById('partnerSelect').value,
                date: document.getElementById('txDate').value,
                amount: finalAmount
            };

            // 推入當前帳簿的陣列中
            initialHistory[selectedLedger].unshift(newRecord); // 新增在最上方

            // 重新渲染列表，金額會自動重新加總
            renderList(selectedLedger);

            // 清空輸入框表單（保留日期與預設選單）
            document.getElementById('amount').value = '1';
            document.getElementById('memo').value = '';
        });

        // 初始載入與監聽
        switcher.addEventListener('change', updateLedgerTheme);
        updateLedgerTheme();
    </script>
</body>

</html>
